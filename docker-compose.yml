services:
  connector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - connector-data:/app/data
    environment:
      OOMOL_CONNECT_DATA_DIR: /app/data
      OOMOL_CONNECT_ORIGIN: https://connections.fractals-solutions.com
      OOMOL_CONNECT_ENCRYPTION_KEY:
      BETTER_AUTH_URL: https://connections.fractals-solutions.com
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a server-only auth secret}
      BETTER_AUTH_TRUSTED_ORIGINS: https://connections.fractals-solutions.com
      AUTH_MAIL_TRANSPORT: ${AUTH_MAIL_TRANSPORT:-smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:?Set the verified sender}
      DATABASE_URL: ${DATABASE_URL:?Set the Connections PostgreSQL database}
      OOMOL_CONNECT_ALLOWED_ACTIONS:
      OOMOL_CONNECT_BLOCKED_ACTIONS:
      OOMOL_CONNECT_ALLOWED_PROXIES:
      OOMOL_CONNECT_BLOCKED_PROXIES:
      CONNECTIONS_OPEN_FLOW_BACKENDS:

  open-flow:
    build:
      context: https://github.com/Ntrakiyski/open-flow.git#5418108b29315872ff2d6201fdd97503b8aacd5a
      dockerfile: apps/server/Dockerfile
    stop_grace_period: 45s
    volumes:
      - open-flow-data:/data/open-flow
    environment:
      OPEN_FLOW_CONNECTOR_ORIGIN: http://connector:3000
      OPEN_FLOW_CONNECTOR_CONSOLE_ORIGIN: https://connections.fractals-solutions.com
      OPEN_FLOW_CONNECTOR_TOKEN: ${OPEN_FLOW_CONNECTOR_TOKEN:?Set the workspace Connector token}
      OPEN_FLOW_TOKEN: ${OPEN_FLOW_TOKEN:?Set the private Open Flow operator token}
      OPEN_FLOW_SESSION_COOKIE_SECURE: "true"

volumes:
  connector-data:
  open-flow-data:
    external: true
    name: ${OPEN_FLOW_DATA_VOLUME}
